name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git             zip             unzip             openjdk-17-jdk             autoconf             automake             libtool             pkg-config             zlib1g-dev             libncurses5-dev             libncursesw5-dev             libtinfo5             cmake             libffi-dev             libssl-dev             libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer.git
          python -m pip install legacy-cgi setuptools "cython==0.29.34"

      # Do not restore ~/.buildozer or .buildozer here.
      # The previous run contained a broken p4a/pip environment.
      - name: Clean previous Buildozer state
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Verify Buildozer configuration
        run: |
          test -f buildozer.spec
          grep -E '^(requirements|p4a.branch|android.api|android.ndk|android.archs)' buildozer.spec

      - name: Build debug APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          find bin -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suri-portal-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
